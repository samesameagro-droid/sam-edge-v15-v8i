name: SAM EDGE CB Pro NXT Inspired Benchmark

on:
  push:
    branches:
      - research/premium-indicator-benchmark
    paths:
      - "research/cbpro_nxt_benchmark.py"
      - "research/premium_indicator_benchmark.py"
      - "research/fetch_historical_ohlcv.py"
      - ".github/workflows/cbpro_nxt_benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbpro-nxt-research-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v4
        with:
          ref: research/premium-indicator-benchmark
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy ccxt requests
      - name: Compile research modules
        run: python -m py_compile research/premium_indicator_benchmark.py research/cbpro_nxt_benchmark.py research/fetch_historical_ohlcv.py
      - name: Download historical OHLCV through 2026-09-30 UTC
        run: python research/fetch_historical_ohlcv.py --start-date 2025-01-01 --end-date 2026-09-30 --data data
      - name: Run baseline-cost benchmark
        run: python research/cbpro_nxt_benchmark.py --data data --out research/results/cbpro_nxt_baseline --fee-bps 5 --slippage-bps 2
      - name: Run stressed-cost benchmark
        run: python research/cbpro_nxt_benchmark.py --data data --out research/results/cbpro_nxt_stress --fee-bps 8 --slippage-bps 5
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-edge-cbpro-nxt-inspired-benchmark
          if-no-files-found: warn
          path: |
            research/results/cbpro_nxt_baseline/
            research/results/cbpro_nxt_stress/
      - name: Persist results to research branch
        if: success()
        run: |
          git config user.name "SAM EDGE RESEARCH BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/cbpro_nxt_baseline research/results/cbpro_nxt_stress
          if ! git diff --cached --quiet; then
            git commit -m "research: persist CB Pro NXT-inspired benchmark results"
            git fetch origin research/premium-indicator-benchmark
            git rebase origin/research/premium-indicator-benchmark
            git push origin HEAD:research/premium-indicator-benchmark
          else
            echo "No result changes to persist."
          fi

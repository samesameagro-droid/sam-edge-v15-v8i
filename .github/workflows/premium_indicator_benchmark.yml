name: SAM EDGE Public Indicator Benchmark

on:
  push:
    branches:
      - research/premium-indicator-benchmark
    paths:
      - "research/premium_indicator_benchmark.py"
      - "research/strategy_sweep.py"
      - "research/structural_strategy_benchmark.py"
      - "research/fetch_historical_ohlcv.py"
      - ".github/workflows/premium_indicator_benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premium-indicator-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v4
        with:
          ref: research/premium-indicator-benchmark
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip ccxt requests pandas numpy
      - name: Compile research modules
        run: python -m py_compile research/premium_indicator_benchmark.py research/fetch_historical_ohlcv.py research/strategy_sweep.py research/structural_strategy_benchmark.py
      - name: Download historical OHLCV (through 2026-09-30 UTC)
        run: python research/fetch_historical_ohlcv.py --start-date 2025-01-01 --end-date 2026-09-30 --data data
      - name: Run baseline-cost benchmark
        run: python research/premium_indicator_benchmark.py --data data --out research/results/premium_indicator_baseline --fee-bps 5 --slippage-bps 2
      - name: Run stressed-cost benchmark
        run: python research/premium_indicator_benchmark.py --data data --out research/results/premium_indicator_stress --fee-bps 8 --slippage-bps 5
      - name: Run 108-configuration strategy sweep
        run: python research/strategy_sweep.py --data data --out research/results/strategy_sweep --fee-bps 5 --slippage-bps 2
      - name: Run structural strategy benchmark (27 configurations)
        run: python research/structural_strategy_benchmark.py --data data --out research/results/structural_benchmark --fee-bps 5 --slippage-bps 2
      - name: Upload results and source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-edge-public-indicator-benchmark
          if-no-files-found: warn
          path: |
            research/results/premium_indicator_baseline/
            research/results/premium_indicator_stress/
            research/results/strategy_sweep/
            research/results/structural_benchmark/
            data/*/*.csv
      - name: Persist results to research branch
        if: success()
        run: |
          git config user.name "SAM EDGE RESEARCH BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/premium_indicator_baseline research/results/premium_indicator_stress research/results/strategy_sweep research/results/structural_benchmark
          if ! git diff --cached --quiet; then
            git commit -m "research: persist public indicator benchmark results"
            git fetch origin research/premium-indicator-benchmark
            git rebase origin/research/premium-indicator-benchmark
            git push origin HEAD:research/premium-indicator-benchmark
          else
            echo "No result changes to persist."
          fi

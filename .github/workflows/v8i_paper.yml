name: SAM EDGE V15 - V8I Paper Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Asia/Jakarta'
  workflow_dispatch:

concurrency:
  group: sam-edge-v8i-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one-shot V8I scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          MIN_VOLUME_USDT: '10000000'
          UNIVERSE_LIMIT: '100'
          MAX_ACTIVE_POSITIONS: '5'
        run: python paper_scan_once.py

      - name: Persist paper state and journal
        run: |
          git config user.name "SAM EDGE BOT"
          git config user.email "sam-edge-bot@users.noreply.github.com"
          git add paper_v8i_state.json paper_v8i_trades.csv paper_v8i_signal_history.json paper_v8i_universe.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "paper: V8I scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

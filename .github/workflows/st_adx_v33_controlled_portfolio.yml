name: ST-ADX V3.3 - Controlled Universe Portfolio Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate research scripts
        run: |
          python -m py_compile st_adx_v31/strategy_core.py st_adx_v31/research_150_universe_v33.py st_adx_v31/research_150_portfolio_v1.py
      - name: Run isolated universe, portfolio and walk-forward research
        run: python -u st_adx_v31/research_150_portfolio_v1.py
      - name: Upload reports even if research fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st-adx-v33-controlled-portfolio-research
          path: st_adx_v31/research_150_portfolio_v1/
          if-no-files-found: warn
          retention-days: 30

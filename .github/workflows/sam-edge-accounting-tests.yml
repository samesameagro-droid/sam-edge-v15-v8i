name: SAM EDGE Accounting Unit Tests

on:
  push:
    branches:
      - sam-edge-v15-accounting-risk-patch
  pull_request:
  workflow_dispatch:

jobs:
  accounting-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run accounting tests
        run: python -m unittest discover -s tests -v

name: V15 Engine Research

on:
  push:
    branches: [main]
    paths:
      - 'core_engine_v15.py'
      - 'research_v15_compare.py'
      - '.github/workflows/v15_engine_research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt pandas numpy requests

      - name: Run 180-day legacy vs early comparison
        run: python research_v15_compare.py --days 180

      - name: Upload research results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-engine-research
          if-no-files-found: warn
          path: |
            v15_engine_compare_results.csv
            v15_engine_compare_trades.csv
            v15_engine_compare_diagnostics.csv

      - name: Persist research results
        if: always()
        run: |
          git config user.name "SAM EDGE V15 RESEARCH"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v15_engine_compare_results.csv v15_engine_compare_trades.csv v15_engine_compare_diagnostics.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: persist legacy-vs-early V15 backtest"
            git push
          else
            echo "No research files changed."
          fi

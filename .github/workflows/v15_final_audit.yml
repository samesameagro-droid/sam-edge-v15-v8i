name: V15 Final 53 Trade Audit

on:
  push:
    branches:
      - research/v15-final-53-audit-btc
    paths:
      - 'research/v15_final_audit.py'
      - '.github/workflows/v15_final_audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v15-final-53-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run final V15 audit
        run: python -u research/v15_final_audit.py

      - name: Persist research outputs
        run: |
          git config user.name "SAM EDGE Research Bot"
          git config user.email "sam-edge-research-bot@users.noreply.github.com"
          git add research/v15_final_audit.py v15_final_audit/
          git diff --cached --quiet && exit 0
          git commit -m "research: persist V15 final audit outputs [skip ci]"
          git push origin HEAD:research/v15-final-53-audit-btc

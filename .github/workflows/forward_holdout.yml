name: SAM EDGE Fixed Forward Holdout

on:
  push:
    branches:
      - research/premium-indicator-benchmark
    paths:
      - "research/forward_holdout_replay.py"
      - "research/portfolio_event_replay.py"
      - "research/mtf_30m_replay.py"
      - ".github/workflows/forward_holdout.yml"
  workflow_dispatch:
  # Binance Vision daily USD-M archives may publish hours after UTC midnight.
  # Retry after the usual publication window instead of repeatedly failing early.
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: read

concurrency:
  group: sam-edge-fixed-forward-holdout-current
  # Cancel stale runs when a new research fix is pushed; only the latest code should run.
  cancel-in-progress: true

jobs:
  forward-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v4
        with:
          # Pin the replay to the exact commit that triggered this run.
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile research scripts
        run: python -m py_compile research/mtf_30m_replay.py research/portfolio_event_replay.py research/forward_holdout_replay.py
      - name: Run fixed-rule forward holdout (no threshold selection)
        run: python research/forward_holdout_replay.py
      - name: Upload fixed forward holdout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-edge-forward-holdout-from-2026-10-10
          if-no-files-found: warn
          path: research/results/new_forward_holdout/

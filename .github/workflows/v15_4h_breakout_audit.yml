name: V15 research - 4H breakout audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests urllib3
      - name: Run 4H breakout audit
        run: python research/v15_4h_breakout_audit.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: v15-4h-breakout-audit
          path: v15_4h_breakout_audit/

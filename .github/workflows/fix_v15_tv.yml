name: Fix V15 TradingView Mirror

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize Pine and add dashboard identity header
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('SAM_EDGE_V15_TradingView_LATEST.pine')
          s = p.read_text(encoding='utf-8')

          # Pine editor rejects the non-breaking whitespace that was accidentally
          # introduced into the dashboard section. Keep source strictly ASCII.
          for a, b in {
              '\u00a0': ' ',
              '\u202f': ' ',
              '\u2007': ' ',
              '\u2014': '-',
              '\u2013': '-',
              '\u2018': "'",
              '\u2019': "'",
              '\u201c': '"',
              '\u201d': '"',
              '\u2713': 'OK',
          }.items():
              s = s.replace(a, b)

          # Dashboard: reserve row 0 for a clear indicator identity header.
          old = 'var table dash = table.new(position.top_right, 3, 16, border_width=1, frame_color=color.new(color.white, 88))'
          new = 'var table dash = table.new(position.top_right, 3, 17, border_width=1, frame_color=color.new(color.white, 88))'
          s = s.replace(old, new)

          def shift(m):
              return f'table.cell(dash, {m.group(1)}, {int(m.group(2)) + 1},'

          s = re.sub(r'table\\.cell\\(dash,\\s*(0|1|2),\\s*(\\d+),', shift, s)

          marker = 'if showDashboard and barstate.islast\n'
          header = (
              'if showDashboard and barstate.islast\n'
              '    // Identity header: exact indicator/core name\n'
              '    table.cell(dash, 0, 0, "SAM EDGE V15", text_color=color.white, bgcolor=cPanel, text_size=size.small)\n'
              '    table.cell(dash, 1, 0, "ADX4H + C2H", text_color=cEntry, bgcolor=cPanel, text_size=size.small)\n'
              '    table.cell(dash, 2, 0, "EXEC 15M", text_color=cLong, bgcolor=cPanel, text_size=size.small)\n'
          )
          if 'Identity header: exact indicator/core name' not in s:
              if marker not in s:
                  raise SystemExit('Dashboard marker not found')
              s = s.replace(marker, header, 1)

          s = s.encode('ascii').decode('ascii')
          p.write_text(s, encoding='ascii')

      - name: Commit fixed mirror and remove one-shot workflow
        run: |
          rm -f .github/workflows/fix_v15_tv.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SAM_EDGE_V15_TradingView_LATEST.pine .github/workflows/fix_v15_tv.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: V15 TradingView mirror Pine syntax and dashboard title'
          git push

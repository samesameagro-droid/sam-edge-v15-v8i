name: SAM EDGE V15 - Paper Forward

on:
  workflow_dispatch:
  schedule:
    # Continuous signal monitoring. GitHub Actions minimum practical cron interval is 5 minutes.
    - cron: '*/5 * * * *'

concurrency:
  group: sam-edge-v15-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run V15 one-shot signal check
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          START_EQUITY: "100"
          RISK_PCT: "0.005"
          HISTORY_15M: "3600"
          FETCH_CHUNK: "900"
          MIN_VOLUME_USDT: "3000000"
          UNIVERSE_LIMIT: "100"
          MAX_ACTIVE_POSITIONS: "5"
          RUN_ONCE: "1"
        run: |
          START_TS=$(date +%s)
          set +e
          python run_v15.py
          RC=$?
          END_TS=$(date +%s)
          ELAPSED=$((END_TS-START_TS))
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "V15 SIGNAL CHECK EXIT=$RC | elapsed=${ELAPSED}s"
          if [ "$RC" -ne 0 ]; then
            echo "V15 SIGNAL CHECK FAILED — scanner exited with code $RC"
            exit "$RC"
          fi

      - name: Persist V15 paper state
        if: ${{ success() }}
        run: |
          set -e
          git config user.name "SAM EDGE V15 BOT"
          git config user.email "sam-edge-v15-bot@users.noreply.github.com"

          STATE_FILES="paper_v15_state.json paper_v15_signal_history.json paper_v15_universe.json pending_telegram_signals.json"
          if [ -f paper_v15_trades.csv ]; then
            STATE_FILES="$STATE_FILES paper_v15_trades.csv"
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          for f in $STATE_FILES; do
            if [ -f "$f" ]; then
              cp "$f" "$TMP_DIR/$(basename "$f")"
            fi
          done

          for attempt in 1 2 3 4 5; do
            echo "STATE PUSH ATTEMPT $attempt"
            git fetch origin main
            git reset --hard origin/main

            for f in $STATE_FILES; do
              if [ -f "$TMP_DIR/$(basename "$f")" ]; then
                cp "$TMP_DIR/$(basename "$f")" "$f"
              fi
            done

            # pending_telegram_signals.json is a durable retry queue. If this scan
            # has no pending messages, remove the old queued copy from the branch.
            if [ ! -f "$TMP_DIR/pending_telegram_signals.json" ]; then
              rm -f pending_telegram_signals.json
            fi

            git add -A $STATE_FILES
            if git diff --cached --quiet; then
              echo "NO STATE CHANGES AFTER SYNC"
              exit 0
            fi

            git commit -m "paper: V15 forward state"

            if git push origin HEAD:main; then
              echo "STATE PUSH OK"
              exit 0
            fi

            echo "REMOTE MOVED - retrying"
            sleep 2
          done

          echo "STATE PUSH FAILED AFTER 5 ATTEMPTS"
          exit 1

name: SAM EDGE V15 - Paper Forward

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sam-edge-v15-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run V15 one-shot scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          START_EQUITY: "100"
          RISK_PCT: "0.005"
          HISTORY_15M: "3600"
          FETCH_CHUNK: "900"
          MIN_VOLUME_USDT: "3000000"
          UNIVERSE_LIMIT: "100"
          MAX_ACTIVE_POSITIONS: "5"
        run: |
          python -c "from main_paper_v15 import PaperEngine; PaperEngine().scan_once()"

      - name: Persist V15 paper state
        run: |
          git config user.name "SAM EDGE V15 BOT"
          git config user.email "sam-edge-v15-bot@users.noreply.github.com"
          git add -f paper_v15_state.json paper_v15_signal_history.json paper_v15_universe.json
          if [ -f paper_v15_trades.csv ]; then
            git add -f paper_v15_trades.csv
          fi
          if git diff --cached --quiet; then
            echo "NO STATE CHANGES"
          else
            git commit -m "paper: V15 forward state"
            git push
          fi

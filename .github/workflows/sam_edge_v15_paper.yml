name: SAM EDGE V15 - Paper Forward

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sam-edge-v15-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run V15 signal check (every 5 minutes)
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          START_EQUITY: "100"
          RISK_PCT: "0.005"
          HISTORY_15M: "3600"
          FETCH_CHUNK: "900"
          MIN_VOLUME_USDT: "3000000"
          UNIVERSE_LIMIT: "100"
          MAX_ACTIVE_POSITIONS: "5"
        run: |
          START_TS=$(date +%s)
          set +e
          python -c "from main_paper_v15 import PaperEngine; PaperEngine().scan_once()"
          RC=$?
          END_TS=$(date +%s)
          ELAPSED=$((END_TS-START_TS))
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "V15 SIGNAL CHECK EXIT=$RC | elapsed=${ELAPSED}s"
          exit 0

      - name: Persist V15 paper state
        if: ${{ !cancelled() }}
        run: |
          set -e
          git config user.name "SAM EDGE V15 BOT"
          git config user.email "sam-edge-v15-bot@users.noreply.github.com"

          git add -f paper_v15_state.json paper_v15_signal_history.json paper_v15_universe.json
          if [ -f paper_v15_trades.csv ]; then
            git add -f paper_v15_trades.csv
          fi

          if git diff --cached --quiet; then
            echo "NO STATE CHANGES"
            exit 0
          fi

          git commit -m "paper: V15 forward state"

          for attempt in 1 2 3 4 5; do
            echo "STATE PUSH ATTEMPT $attempt"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "STATE PUSH OK"
                exit 0
              fi
            else
              echo "REBASE CONFLICT - aborting"
              git rebase --abort || true
              exit 1
            fi

            echo "REMOTE MOVED - retrying"
            sleep 2
          done

          echo "STATE PUSH FAILED AFTER 5 ATTEMPTS"
          exit 1

name: SAM EDGE V15 - Paper Forward

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Verify Telegram bot and send a test message before running the V15 scan'
        required: false
        default: false
        type: boolean
  schedule:
    # Continuous signal monitoring. GitHub Actions minimum practical cron interval is 5 minutes.
    - cron: '*/5 * * * *'

concurrency:
  # Telegram tests get their own lane so they cannot be cancelled/queued behind a V15 scan.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test == true && 'telegram-test' || 'v15-scan' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt matplotlib

      - name: Verify Telegram bot and delivery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          token = (os.getenv('TELEGRAM_BOT_TOKEN') or '').strip()
          chat_id = (os.getenv('TELEGRAM_CHAT_ID') or '').strip()
          if not token:
              print('TELEGRAM AUTH TEST FAILED | TELEGRAM_BOT_TOKEN not configured')
              sys.exit(1)
          if not chat_id:
              print('TELEGRAM DELIVERY TEST FAILED | TELEGRAM_CHAT_ID not configured')
              sys.exit(1)

          api = f'https://api.telegram.org/bot{token}'

          # Phase 1: authenticate the bot independently of the target chat.
          try:
              r = requests.get(f'{api}/getMe', timeout=30)
              print(f'TELEGRAM GETME HTTP={r.status_code}')
              if not r.ok:
                  print(f'TELEGRAM AUTH TEST FAILED | HTTP {r.status_code} | {r.text}')
                  sys.exit(1)
              data = r.json()
              if not data.get('ok'):
                  print(f'TELEGRAM AUTH TEST FAILED | API response: {data}')
                  sys.exit(1)
              bot = data.get('result', {})
              print(f'TELEGRAM AUTH OK | bot_id={bot.get("id")} | username=@{bot.get("username")}')
          except Exception as e:
              print(f'TELEGRAM AUTH TEST ERROR | {type(e).__name__}: {e}')
              sys.exit(1)

          # Phase 2: verify that the configured chat can receive a message.
          payload = {
              'chat_id': chat_id,
              'text': '✅ SAM EDGE V15 Telegram test OK | GitHub Actions → Telegram',
          }
          try:
              r = requests.post(f'{api}/sendMessage', json=payload, timeout=30)
              print(f'TELEGRAM SEND HTTP={r.status_code}')
              if not r.ok:
                  print(f'TELEGRAM DELIVERY TEST FAILED | HTTP {r.status_code} | {r.text}')
                  sys.exit(1)
              data = r.json()
              if not data.get('ok'):
                  print(f'TELEGRAM DELIVERY TEST FAILED | API response: {data}')
                  sys.exit(1)
              print(f'TELEGRAM TEST SENT OK | message_id={data.get("result", {}).get("message_id")}')
          except Exception as e:
              print(f'TELEGRAM DELIVERY TEST ERROR | {type(e).__name__}: {e}')
              sys.exit(1)
          PY

      - name: Run V15 professional one-shot forward-test scan
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          START_EQUITY: "100"
          RISK_PCT: "0.005"
          HISTORY_15M: "3600"
          FETCH_CHUNK: "900"
          MIN_VOLUME_USDT: "3000000"
          UNIVERSE_LIMIT: "100"
          MAX_ACTIVE_POSITIONS: "1"
          RUN_ONCE: "1"
          TELEGRAM_CHART_CANDLES: "80"
        run: |
          START_TS=$(date +%s)
          set +e
          python run_v15_forward_test_pro.py
          RC=$?
          END_TS=$(date +%s)
          ELAPSED=$((END_TS-START_TS))
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "V15 PROFESSIONAL SCAN EXIT=$RC | elapsed=${ELAPSED}s"
          if [ "$RC" -ne 0 ]; then
            echo "V15 PROFESSIONAL SCAN FAILED — scanner exited with code $RC"
            exit "$RC"
          fi

      - name: Persist V15 + Master Forward Test state
        if: ${{ success() }}
        run: |
          set -e
          git config user.name "SAM EDGE V15 BOT"
          git config user.email "sam-edge-v15-bot@users.noreply.github.com"

          STATE_FILES="paper_v15_state.json paper_v15_signal_history.json paper_v15_universe.json pending_telegram_signals.json telegram_delivery_history.json v15_forward_test_master_journal.csv v15_forward_test_master_state.json v15_forward_test_summary.json"
          if [ -f paper_v15_trades.csv ]; then
            STATE_FILES="$STATE_FILES paper_v15_trades.csv"
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          for f in $STATE_FILES; do
            if [ -f "$f" ]; then
              cp "$f" "$TMP_DIR/$(basename "$f")"
            fi
          done

          for attempt in 1 2 3 4 5; do
            echo "STATE PUSH ATTEMPT $attempt"
            git fetch origin main
            git reset --hard origin/main

            for f in $STATE_FILES; do
              if [ -f "$TMP_DIR/$(basename "$f")" ]; then
                cp "$TMP_DIR/$(basename "$f")" "$f"
              fi
            done

            if [ ! -f "$TMP_DIR/pending_telegram_signals.json" ]; then
              rm -f pending_telegram_signals.json
            fi

            git add -A
            if git diff --cached --quiet; then
              echo "NO STATE CHANGES AFTER SYNC"
              exit 0
            fi

            git commit -m "paper: V15 professional forward state"

            if git push origin HEAD:main; then
              echo "STATE PUSH OK"
              exit 0
            fi

            echo "REMOTE MOVED - retrying"
            sleep 2
          done

          echo "STATE PUSH FAILED AFTER 5 ATTEMPTS"
          exit 1

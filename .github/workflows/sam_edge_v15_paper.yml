name: ST-ADX V3.1 - BingX Paper Forward

on:
  push:
    branches: [main]
    paths:
      - 'st_adx_v31/strategy_core.py'
      - 'st_adx_v31/paper_forward_github.py'
      - '.github/workflows/sam_edge_v15_paper.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate ST-ADX V3.1 sources
        run: |
          python -m py_compile st_adx_v31/strategy_core.py st_adx_v31/paper_forward_github.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "st_adx_v31")
          from strategy_core import LONG_ALLOWLIST, SHORT_ALLOWLIST, add_indicators
          import pandas as pd
          assert len(LONG_ALLOWLIST | SHORT_ALLOWLIST) == 12
          rows = []
          for i in range(300):
              close = 100 + i * 0.02 + ((i % 7) - 3) * 0.1
              rows.append([i * 3600000, close - 0.02, close + 0.2, close - 0.2, close, 1000])
          df = pd.DataFrame(rows, columns=["timestamp","open","high","low","close","volume"])
          out = add_indicators(df)
          assert len(out) == 300 and "adx_rising" in out and "long_signal" in out
          print("ST-ADX CORE SMOKE TEST PASS | 12 symbols | corrected consecutive ADX rising")
          PY

      - name: Run one BingX paper cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPER_INITIAL_EQUITY: "100000"
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 300s python -u st_adx_v31/paper_forward_github.py
          RC=$?
          echo "ST-ADX paper cycle exit=$RC"
          exit "$RC"

      - name: Persist ST-ADX paper state and journal
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "ST-ADX V3.1 PAPER BOT"
          git config user.email "st-adx-v31-paper-bot@users.noreply.github.com"
          FILES=(st_adx_v31/paper_state.json st_adx_v31/paper_signals.csv st_adx_v31/paper_trades.csv)
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then mkdir -p "$TMP/$(dirname "$f")"; cp "$f" "$TMP/$f"; fi
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in "${FILES[@]}"; do
              if [ -f "$TMP/$f" ]; then mkdir -p "$(dirname "$f")"; cp "$TMP/$f" "$f"; fi
            done
            git add -- "${FILES[@]}"
            if git diff --cached --quiet; then
              echo "No ST-ADX state changes to persist"
              exit 0
            fi
            git commit -m "paper: ST-ADX V3.1 forward state"
            if git push origin HEAD:main; then
              echo "ST-ADX PAPER STATE PUSH OK"
              exit 0
            fi
            sleep 2
          done
          echo "ST-ADX state push failed after 5 attempts"
          exit 1

name: Fix V15 Telegram signal delivery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Telegram delivery without changing V15 core
        shell: python
        run: |
          from pathlib import Path

          p = Path('main_paper_v15.py')
          s = p.read_text(encoding='utf-8')

          old = '''        for c in selected:\n            p = c['position']; key = c['key']\n            self.positions[p.coin] = p\n            self.signal_history.add(key)\n            print(f'✅ SIGNAL | {p.coin} | {p.side} | score={c["score"]:.1f} | Entry={p.entry:.8g} SL={p.sl:.8g} TP={p.tp:.8g}')\n            try:\n                from notifiers import send_signal\n                payload = asdict(p); payload['selection_score'] = round(c['score'], 2)\n                send_signal(payload, self.equity)\n            except Exception as e:\n                print('TELEGRAM ERROR:', e)\n'''

          new = '''        # Telegram must receive EVERY NEW VALID V15 candidate.\n        # MAX_ACTIVE controls paper execution only; it must not suppress a valid signal notification.\n        # signal_history prevents the same V15 signal from being sent repeatedly.\n        try:\n            from notifiers import send_signal\n            selected_keys = {c['key'] for c in selected}\n            for c in candidates:\n                p = c['position']; key = c['key']\n                if key in self.signal_history:\n                    continue\n                is_selected = key in selected_keys\n                payload = asdict(p)\n                payload['selection_score'] = round(c['score'], 2)\n                payload['telegram_status'] = 'EXECUTED' if is_selected else 'VALID V15 SIGNAL - WAITLIST'\n                sent = send_signal(payload, self.equity)\n                if sent:\n                    self.signal_history.add(key)\n                    print(f'📨 TELEGRAM SIGNAL | {p.coin} | {p.side} | status={payload["telegram_status"]} | score={c["score"]:.1f}')\n                else:\n                    print(f'⚠️ TELEGRAM NOT SENT | {p.coin} | {p.side} | score={c["score"]:.1f}')\n        except Exception as e:\n            print('TELEGRAM DELIVERY ERROR:', e)\n
        for c in selected:\n            p = c['position']; key = c['key']\n            self.positions[p.coin] = p\n            print(f'✅ SIGNAL | {p.coin} | {p.side} | score={c["score"]:.1f} | Entry={p.entry:.8g} SL={p.sl:.8g} TP={p.tp:.8g}')\n'''

          if old not in s:
              raise SystemExit('Expected V15 selection/Telegram block was not found; no patch applied.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          n = Path('notifiers.py')
          ns = n.read_text(encoding='utf-8')
          ns = ns.replace("        f'MODE: PAPER ONLY'", "        f'STATUS: {p.get(\"telegram_status\", \"EXECUTED\")}\\n'\n        f'MODE: PAPER ONLY'")
          n.write_text(ns, encoding='utf-8')

      - name: Verify patch and remove one-shot workflow
        shell: bash
        run: |
          python -m py_compile main_paper_v15.py notifiers.py
          grep -q "Telegram must receive EVERY NEW VALID V15 candidate" main_paper_v15.py
          grep -q "telegram_status" notifiers.py
          rm -f .github/workflows/fix_v15_telegram.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main_paper_v15.py notifiers.py .github/workflows/fix_v15_telegram.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: deliver every new valid V15 signal to Telegram'
          git push

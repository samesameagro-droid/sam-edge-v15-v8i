name: SAM EDGE 30M Multi-Timeframe Replay

on:
  push:
    branches:
      - research/premium-indicator-benchmark
    paths:
      - "research/mtf_30m_replay.py"
      - "research/portfolio_event_replay.py"
      - "research/score_filter_trade_journal.py"
      - ".github/workflows/mtf_30m_replay.yml"
      - "paper_v15_state_v2.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sam-edge-mtf-30m-replay-fast
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v4
        with:
          ref: research/premium-indicator-benchmark
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile replay scripts
        run: python -m py_compile research/mtf_30m_replay.py research/score_filter_trade_journal.py
      - name: Download public candles and replay MTF gates
        run: python research/mtf_30m_replay.py --state paper_v15_state_v2.json --out research/results/mtf_30m_replay --fee-bps 5 --slippage-bps 2
      - name: Fetch authoritative executed journal and score snapshots from main
        if: always()
        run: |
          mkdir -p research/results/score_filter_trade_journal/inputs
          curl -fsSL --retry 3 https://raw.githubusercontent.com/samesameagro-droid/sam-edge-v15-v8i/main/v15_forward_test_master_journal.csv -o research/results/score_filter_trade_journal/inputs/v15_forward_test_master_journal.csv
          curl -fsSL --retry 3 https://raw.githubusercontent.com/samesameagro-droid/sam-edge-v15-v8i/main/paper_v15_state_v2.json -o research/results/score_filter_trade_journal/inputs/paper_v15_state_v2.json
      - name: Backtest score maximum 54 on executed closed trades 1-128
        if: always()
        run: |
          python research/score_filter_trade_journal.py \
            --journal research/results/score_filter_trade_journal/inputs/v15_forward_test_master_journal.csv \
            --state research/results/score_filter_trade_journal/inputs/paper_v15_state_v2.json \
            --first-trade 1 --last-trade 128 --score-max 54 \
            --out research/results/score_filter_trade_journal
      - name: Run full-event Binance portfolio replay and walk-forward holdout
        if: always()
        run: python research/portfolio_event_replay.py --days 365 --end-date 2026-09-25 --out research/results/portfolio_event_replay
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-edge-mtf-30m-replay
          if-no-files-found: warn
          path: |
            research/results/mtf_30m_replay/
            research/results/portfolio_event_replay/
            research/results/score_filter_trade_journal/
      - name: Persist research outputs only
        if: success()
        run: |
          git config user.name "SAM EDGE RESEARCH BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/mtf_30m_replay research/results/portfolio_event_replay
          if ! git diff --cached --quiet; then
            git commit -m "research: add 30m multi-timeframe replay results"
            git fetch origin research/premium-indicator-benchmark
            git rebase origin/research/premium-indicator-benchmark
            git push origin HEAD:research/premium-indicator-benchmark
          fi

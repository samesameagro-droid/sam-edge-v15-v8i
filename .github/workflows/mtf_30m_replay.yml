name: SAM EDGE 30M Multi-Timeframe Replay

on:
  push:
    branches:
      - research/premium-indicator-benchmark
    paths:
      - "research/mtf_30m_replay.py"
      - "research/portfolio_event_replay.py"
      - ".github/workflows/mtf_30m_replay.yml"
      - "paper_v15_state_v2.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sam-edge-mtf-30m-replay-fast
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v4
        with:
          ref: research/premium-indicator-benchmark
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas requests
      - name: Compile replay script
        run: python -m py_compile research/mtf_30m_replay.py
      - name: Download public candles and replay MTF gates
        run: python research/mtf_30m_replay.py --state paper_v15_state_v2.json --out research/results/mtf_30m_replay --fee-bps 5 --slippage-bps 2
      - name: Run full-event Binance portfolio replay and walk-forward holdout
        run: python research/portfolio_event_replay.py --days 180 --out research/results/portfolio_event_replay
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-edge-mtf-30m-replay
          if-no-files-found: warn
          path: research/results/mtf_30m_replay/
      - name: Persist research outputs only
        if: success()
        run: |
          git config user.name "SAM EDGE RESEARCH BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/mtf_30m_replay research/results/portfolio_event_replay
          if ! git diff --cached --quiet; then
            git commit -m "research: add 30m multi-timeframe replay results"
            git fetch origin research/premium-indicator-benchmark
            git rebase origin/research/premium-indicator-benchmark
            git push origin HEAD:research/premium-indicator-benchmark
          fi

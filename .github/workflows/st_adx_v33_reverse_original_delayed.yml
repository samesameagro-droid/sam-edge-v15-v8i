name: ST-ADX V3.3 - Original vs Reverse vs Delayed Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile research and strategy modules
        run: |
          python -m py_compile st_adx_v31/strategy_core.py st_adx_v31/research_150_universe_v33.py st_adx_v31/research_150_portfolio_v1.py st_adx_v31/research_reverse_original_delayed_v1.py
      - name: Run Original vs Reverse vs Delayed comparison
        run: python -u st_adx_v31/research_reverse_original_delayed_v1.py
      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st-adx-original-reverse-delayed-research
          path: st_adx_v31/research_reverse_original_delayed_v1/
          if-no-files-found: warn
          retention-days: 30

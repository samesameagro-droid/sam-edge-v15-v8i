name: V15 BTC Aware Shadow

on:
  push:
    branches:
      - research/v15-btc-aware-shadow
    paths:
      - 'research/v15_btc_aware_shadow.py'
      - '.github/workflows/v15_btc_aware_shadow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python -u research/v15_btc_aware_shadow.py
      - run: |
          git config user.name "SAM EDGE Research Bot"
          git config user.email "sam-edge-research-bot@users.noreply.github.com"
          git add research/v15_btc_aware_shadow.py v15_btc_aware_shadow/
          git diff --cached --quiet && exit 0
          git commit -m "research: persist BTC-aware shadow results [skip ci]"
          git push origin HEAD:research/v15-btc-aware-shadow

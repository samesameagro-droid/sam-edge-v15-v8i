name: V15 Telegram Patch 2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch main and notifier
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main_paper_v15.py')
          s = p.read_text()

          start = s.find("        for c in selected:\n")
          end = s.find("        if len(candidates) > len(selected):\n", start)
          if start < 0 or end < 0:
              raise SystemExit('selection block not found')

          replacement = '''        # Telegram delivery is independent from MAX_ACTIVE paper execution slots.\n        # Every NEW valid V15 candidate is notified once; only the top candidates are opened as paper positions.\n        from notifiers import send_signal\n        selected_keys = {c['key'] for c in selected}\n        for c in candidates:\n            p = c['position']; key = c['key']\n            if key in self.signal_history:\n                continue\n            payload = asdict(p)\n            payload['selection_score'] = round(c['score'], 2)\n            payload['telegram_status'] = 'EXECUTED' if key in selected_keys else 'VALID V15 SIGNAL - WAITLIST'\n            sent = send_signal(payload, self.equity)\n            if sent:\n                self.signal_history.add(key)\n                print(f'📨 TELEGRAM SIGNAL | {p.coin} | {p.side} | status={payload["telegram_status"]} | score={c["score"]:.1f}')\n            else:\n                print(f'⚠️ TELEGRAM NOT SENT | {p.coin} | {p.side} | score={c["score"]:.1f}')\n\n        for c in selected:\n            p = c['position']; key = c['key']\n            self.positions[p.coin] = p\n            print(f'✅ SIGNAL | {p.coin} | {p.side} | score={c["score"]:.1f} | Entry={p.entry:.8g} SL={p.sl:.8g} TP={p.tp:.8g}')\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          n = Path('notifiers.py')
          ns = n.read_text()
          old = "        f'MODE: PAPER ONLY'"
          new = "        f'STATUS: {p.get(\"telegram_status\", \"EXECUTED\")}\\n'\n        f'MODE: PAPER ONLY'"
          if old in ns and 'telegram_status' not in ns:
              ns = ns.replace(old, new, 1)
          n.write_text(ns)
          PY

      - name: Verify
        run: |
          python -m py_compile main_paper_v15.py notifiers.py
          grep -q "Every NEW valid V15 candidate" main_paper_v15.py
          grep -q "telegram_status" notifiers.py

      - name: Commit
        run: |
          rm -f .github/workflows/v15_telegram_patch2.yml .github/workflows/fix_v15_telegram.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main_paper_v15.py notifiers.py .github/workflows/v15_telegram_patch2.yml .github/workflows/fix_v15_telegram.yml
          git commit -m 'fix: Telegram receives every new valid V15 signal' || exit 0
          git push

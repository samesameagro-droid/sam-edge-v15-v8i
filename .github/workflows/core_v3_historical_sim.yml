name: SAM EDGE RR2 Breakout-Retest Validation

on:
  push:
    branches:
      - research/core-v3-historical-sim
    paths:
      - "research/core_v3_strategy_family_backtest.py"
      - "research/fetch_historical_ohlcv.py"
      - ".github/workflows/core_v3_historical_sim.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-v3-historical-replay
  cancel-in-progress: false

jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v4
        with:
          ref: research/core-v3-historical-sim

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip ccxt pandas numpy

      - name: Compile research modules
        run: python -m py_compile core_engine_v15.py research/core_v3.py research/core_v3_historical_sim.py research/core_v3_strategy_family_backtest.py research/fetch_historical_ohlcv.py

      - name: Download read-only historical candles
        run: python research/fetch_historical_ohlcv.py --start-date 2025-01-01 --end-date 2026-10-09 --data data

      - name: Run RR2 breakout-retest baseline costs
        run: python research/core_v3_strategy_family_backtest.py --data data --out research/results/rr2_base --fee-bps 5 --slippage-bps 2

      - name: Run RR2 breakout-retest stressed costs
        run: python research/core_v3_strategy_family_backtest.py --data data --out research/results/rr2_stress --fee-bps 8 --slippage-bps 5

      - name: Upload simulation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-edge-rr2-breakout-retest-validation
          if-no-files-found: warn
          path: |
            research/results/rr2_base/
            research/results/rr2_stress/
            data/*/*.csv

      - name: Persist results to research branch
        if: success()
        run: |
          git config user.name "SAM EDGE RESEARCH BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/rr2_base research/results/rr2_stress
          if ! git diff --cached --quiet; then
            git commit -m "research: persist RR2 breakout-retest validation"
            git fetch origin research/core-v3-historical-sim
            git rebase origin/research/core-v3-historical-sim
            git push origin HEAD:research/core-v3-historical-sim
          else
            echo "No result changes to persist."
          fi

name: Core V2 vs V3 Historical Replay

on:
  push:
    branches:
      - research/core-v3-historical-sim
    paths:
      - "research/core_v3_historical_sim.py"
      - "research/fetch_historical_ohlcv.py"
      - ".github/workflows/core_v3_historical_sim.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-v3-historical-replay
  cancel-in-progress: false

jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research branch only
        uses: actions/checkout@v4
        with:
          ref: research/core-v3-historical-sim

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip ccxt pandas numpy

      - name: Download read-only historical candles
        run: python research/fetch_historical_ohlcv.py --start-date 2025-01-01 --end-date 2026-08-31 --data data

      - name: Run event-driven portfolio replay
        run: python research/core_v3_historical_sim.py --data data --out research/results

      - name: Upload simulation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-v2-v3-historical-replay
          if-no-files-found: warn
          path: |
            research/results/
            data/*/*.csv

      - name: Persist results to research branch
        if: success()
        run: |
          git config user.name "SAM EDGE RESEARCH BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results
          if ! git diff --cached --quiet; then
            git commit -m "research: persist Core V2 vs V3 historical replay"
            git fetch origin research/core-v3-historical-sim
            git rebase origin/research/core-v3-historical-sim
            git push origin HEAD:research/core-v3-historical-sim
          else
            echo "No result changes to persist."
          fi

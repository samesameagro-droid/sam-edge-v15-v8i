name: ST-ADX V3.1 - 100 Coin Historical Research

on:
  push:
    branches: [main]
    paths:
      - 'st_adx_v31/research_100coin.py'
      - 'st_adx_v31/strategy_core.py'
      - '.github/workflows/st_adx_v31_100_coin_research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: st-adx-v31-100-coin-research
  cancel-in-progress: false

jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests

      - name: Validate research runner
        run: python -m py_compile st_adx_v31/strategy_core.py st_adx_v31/research_100coin.py

      - name: Download top 100 and replay ST-ADX V3.1
        env:
          PYTHONUNBUFFERED: '1'
          ST_ADX_100_OUT: st_adx_v31/research_output
        run: python -u st_adx_v31/research_100coin.py

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ST-ADX-V3.1-100-Coin-Research
          path: st_adx_v31/research_output/
          if-no-files-found: warn
          retention-days: 30
